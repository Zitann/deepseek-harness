name: Build Electron Windows Desktop App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      # 1. 检出代码
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 安装并配置 pnpm 11.7.0
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      # 3. 设置 Node.js 环境
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      # 4. 配置 Windows 构建工具环境
      - name: Setup Windows Build Tools
        uses: microsoft/setup-msbuild@v2

      # 5. 安装依赖
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 6. 编译基础库与 native-system
      - name: Build native and lib
        run: |
          pnpm run build:native-system
          pnpm run build:lib

      # 7. 临时修复：在 Windows 上向 fs-ext 提供一个空 Mock（防止冒烟测试 require 报错）
      - name: Mock fs-ext for Windows smoke test
        shell: powershell
        run: |
          $mockDir = "node_modules/fs-ext"
          New-Item -ItemType Directory -Force -Path $mockDir
          Set-Content -Path "$mockDir/index.js" -Value "module.exports = {};"
          Set-Content -Path "$mockDir/package.json" -Value '{"name":"fs-ext","main":"index.js","version":"1.0.0"}'

      # 8. 执行打包（在 Windows 原生环境运行）
      - name: Package Windows App
        run: pnpm run package:desktop:win:x64:unsigned
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 9. 上传产物
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deepseek-desktop-windows-x64
          path: |
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.zip
            apps/desktop/.desktop-build/targets/win-x64/
          retention-days: 7
