name: Build Electron Windows Desktop App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows-cross:
    runs-on: ubuntu-latest # 使用 Linux 节点进行交叉编译

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      # 安装 Wine 和 7z 以支持 Windows 打包
      - name: Install Wine & Build Dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y wine64 wine32 7zip

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 使用项目自带的 Wine 检查脚本或打包脚本
      - name: Build and Package Windows
        run: |
          pnpm run build:native-system
          pnpm run build:lib
          pnpm run package:desktop:win:x64:unsigned
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: deepseek-desktop-windows-x64
          path: apps/desktop/dist/*.exe
